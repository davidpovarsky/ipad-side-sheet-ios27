name: Native iPadOS 27 Side Sheet Screenshots

on:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Slow UI tests (including experimental real-window resize)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-side-sheet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sheet-simulator:
    name: Build and screenshot iPadOS 27 native sheet
    runs-on: xcode-27
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Generate Xcode project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Build, launch, screenshot iPad (3 detents)
        env:
          RUN_UI_TESTS: ${{ inputs.run_ui_tests && '1' || '0' }}
        run: bash ci/run-screenshots.sh
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sheet-screenshots
          if-no-files-found: warn
          retention-days: 14
          path: |
            screenshots/
            logs/
            results/
