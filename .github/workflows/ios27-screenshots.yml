name: Native iPadOS 27 Side Sheet Screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sheet-simulator:
    name: Build, run and screenshot real iPadOS 27 sheet
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode 27 environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available

      - name: Install project generator
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodegen generate
          xcodebuild -list -project SideSheetLab.xcodeproj

      - name: Compile, launch and capture iPad and iPhone native sheets
        run: bash ci/run-screenshots.sh

      - name: Upload native screenshots and diagnostic logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sheet-screenshots
          if-no-files-found: warn
          retention-days: 14
          path: |
            screenshots/
            logs/
            results/
