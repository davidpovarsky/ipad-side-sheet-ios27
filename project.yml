name: SideSheetLab
options:
  bundleIdPrefix: com.davidpovarsky
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  SideSheetLab:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.sidesheetlab
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    scheme:
      testTargets:
        - SideSheetUITests
  SideSheetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SideSheetLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
